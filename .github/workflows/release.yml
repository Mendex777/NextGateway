name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate installer and backend
        run: |
          bash -n deploy/install.sh deploy/build-release.sh
          python -m pip install -e ".[dev]"
          python -m ruff check backend
          python -m pytest -q
      - name: Build release assets
        run: bash deploy/build-release.sh "$RUNNER_TEMP/release"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/release/nextgateway.tar.gz
            ${{ runner.temp }}/release/nextgateway.tar.gz.sha256
